<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Language capability map</title>
  <desc id="desc">Languages Jon builds with across artificial intelligence, products, data systems, infrastructure, and performance engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#07101F"/><stop offset="1" stop-color="#101A2B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4F7CFF"/><stop offset=".52" stop-color="#2DD4BF"/><stop offset="1" stop-color="#F59E42"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#91A0B8" stroke-opacity=".05"/></pattern>
    <clipPath id="clip"><rect width="600" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="260" fill="url(#bg)"/>
    <rect width="600" height="260" fill="url(#grid)"/>
    <text x="28" y="33" fill="#71809A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">LANGUAGES / CAPABILITY MAP</text>
    <text x="28" y="58" fill="#D7DEEA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">What I build with—not a repository byte count.</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <g transform="translate(28 82)">
        <rect width="168" height="58" rx="12" fill="#4F7CFF" fill-opacity=".08" stroke="#4F7CFF" stroke-opacity=".28"/>
        <circle cx="20" cy="20" r="5" fill="#4F7CFF"><animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
        <text x="34" y="24" fill="#EEF2FF" font-size="14" font-weight="700">Python</text><text x="20" y="44" fill="#8FA0BC" font-size="9" letter-spacing="1">AI · DATA · APIS</text>
      </g>
      <g transform="translate(216 82)">
        <rect width="168" height="58" rx="12" fill="#2DD4BF" fill-opacity=".07" stroke="#2DD4BF" stroke-opacity=".27"/>
        <circle cx="20" cy="20" r="5" fill="#2DD4BF"><animate attributeName="opacity" values=".35;1;.35" dur="2.5s" repeatCount="indefinite"/></circle>
        <text x="34" y="24" fill="#ECFFFC" font-size="14" font-weight="700">TypeScript</text><text x="20" y="44" fill="#8FA0BC" font-size="9" letter-spacing="1">PRODUCT · WEB · MOBILE</text>
      </g>
      <g transform="translate(404 82)">
        <rect width="168" height="58" rx="12" fill="#F3C969" fill-opacity=".07" stroke="#F3C969" stroke-opacity=".27"/>
        <circle cx="20" cy="20" r="5" fill="#F3C969"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
        <text x="34" y="24" fill="#FFF9EA" font-size="14" font-weight="700">SQL</text><text x="20" y="44" fill="#8FA0BC" font-size="9" letter-spacing="1">DATA · ANALYTICS · MODELS</text>
      </g>
      <g transform="translate(122 158)">
        <rect width="168" height="58" rx="12" fill="#38BDF8" fill-opacity=".07" stroke="#38BDF8" stroke-opacity=".27"/>
        <circle cx="20" cy="20" r="5" fill="#38BDF8"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/></circle>
        <text x="34" y="24" fill="#EFFAFF" font-size="14" font-weight="700">Go</text><text x="20" y="44" fill="#8FA0BC" font-size="9" letter-spacing="1">SERVICES · WORKERS · SYSTEMS</text>
      </g>
      <g transform="translate(310 158)">
        <rect width="168" height="58" rx="12" fill="#F59E42" fill-opacity=".07" stroke="#F59E42" stroke-opacity=".28"/>
        <circle cx="20" cy="20" r="5" fill="#F59E42"><animate attributeName="opacity" values="1;.35;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <text x="34" y="24" fill="#FFF7EF" font-size="14" font-weight="700">Rust</text><text x="20" y="44" fill="#8FA0BC" font-size="9" letter-spacing="1">PERFORMANCE · SERVING · ML</text>
      </g>
    </g>

    <rect x=".75" y=".75" width="598.5" height="258.5" rx="17.25" fill="none" stroke="#91A0B8" stroke-opacity=".14" stroke-width="1.5"/>
    <rect y="257" width="600" height="3" fill="url(#accent)"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
