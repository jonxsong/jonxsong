<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Afterglow - AI sunset forecast</title>
  <desc id="desc">An animated sunset horizon with a glowing sun and forecast palette.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="560" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091328"/><stop offset=".55" stop-color="#352550"/><stop offset="1" stop-color="#D06B5F"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7C6FFF"/><stop offset=".52" stop-color="#F59E78"/><stop offset="1" stop-color="#FFD18A"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#FFF5C7"/><stop offset=".38" stop-color="#FFD58A"/><stop offset="1" stop-color="#FF9B72" stop-opacity="0"/></radialGradient>
    <pattern id="stars" width="55" height="48" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r=".8" fill="#FFFFFF" fill-opacity=".35"/><circle cx="43" cy="29" r=".6" fill="#FFFFFF" fill-opacity=".2"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="11"/></filter>
    <clipPath id="clip"><rect width="600" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="260" fill="url(#bg)"/>
    <rect width="600" height="170" fill="url(#stars)"><animate attributeName="opacity" values=".4;.85;.4" dur="7s" repeatCount="indefinite"/></rect>

    <text x="32" y="31" fill="#B4A9C5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">02 / AI · WEATHER EXPERIENCE</text>
    <text x="32" y="75" fill="#FFF7F2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="650">Afterglow</text>
    <text x="32" y="105" fill="#D5CBDD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">AI-assisted sunset forecasting with color,</text>
    <text x="32" y="124" fill="#D5CBDD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">vibrancy, and the ideal viewing window.</text>

    <g transform="translate(32 157)">
      <text y="10" fill="#C8BFD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" letter-spacing="1.2">PREDICTED PALETTE</text>
      <g transform="translate(0 21)">
        <circle cx="8" cy="8" r="8" fill="#5B5BD6"/><circle cx="30" cy="8" r="8" fill="#A85F9E"/><circle cx="52" cy="8" r="8" fill="#E77A73"/><circle cx="74" cy="8" r="8" fill="#F4AD79"/><circle cx="96" cy="8" r="8" fill="#FFE0A3"/>
      </g>
    </g>

    <g>
      <circle cx="488" cy="138" r="72" fill="url(#sun)" filter="url(#blur)"><animate attributeName="r" values="64;78;64" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="488" cy="140" r="25" fill="#FFE9A9"><animate attributeName="cy" values="144;134;144" dur="6s" repeatCount="indefinite"/></circle>
      <path d="M346 174C397 164 425 181 469 171C512 162 548 174 600 158V260H346Z" fill="#090F20" fill-opacity=".73"/>
      <path d="M346 174C397 164 425 181 469 171C512 162 548 174 600 158" fill="none" stroke="url(#horizon)" stroke-width="2" stroke-opacity=".75"/>
      <g transform="translate(372 55)">
        <rect width="174" height="45" rx="12" fill="#0A1020" fill-opacity=".52" stroke="#FFF4DD" stroke-opacity=".15"/>
        <text x="14" y="18" fill="#C8BFD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" letter-spacing="1.2">VIBRANCY</text>
        <text x="14" y="37" fill="#FFF3C5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">87</text>
        <text x="78" y="30" fill="#FFD79D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">7:42 — 8:10 PM</text>
      </g>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#C2B8CB">
      <text x="32" y="229">OPENAI</text><text x="97" y="229">OPEN-METEO</text><text x="190" y="229">BILINGUAL</text>
    </g>
    <rect x=".75" y=".75" width="598.5" height="258.5" rx="17.25" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1.5"/>
    <rect y="257" width="600" height="3" fill="url(#horizon)"><animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
