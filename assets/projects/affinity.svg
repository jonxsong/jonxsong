<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Affinity - explainable recommendation platform</title>
  <desc id="desc">Animated user and item embeddings converge into an explainable personalized ranking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF9FC"/><stop offset=".52" stop-color="#F3EEFF"/><stop offset="1" stop-color="#EAFBFF"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A855F7"/><stop offset=".5" stop-color="#EC4899"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#C084FC" stop-opacity=".24"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#74558B" fill-opacity=".09"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="clip"><rect width="600" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="260" fill="url(#bg)"/>
    <rect width="600" height="260" fill="url(#dots)"/>
    <circle cx="492" cy="115" r="155" fill="url(#glow)"><animate attributeName="opacity" values=".5;1;.5" dur="6s" repeatCount="indefinite"/></circle>

    <text x="32" y="31" fill="#80678E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">06 / ML · PERSONALIZATION</text>
    <text x="32" y="75" fill="#34213F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="650">Affinity</text>
    <text x="32" y="105" fill="#695A71" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Learn from behavior, train modern retrieval</text>
    <text x="32" y="124" fill="#695A71" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">models, and explain every ranked result.</text>

    <g transform="translate(32 157)">
      <rect width="153" height="30" rx="15" fill="#FFFFFF" fill-opacity=".72" stroke="#A855F7" stroke-opacity=".28"/>
      <circle cx="17" cy="15" r="3" fill="#EC4899"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="28" y="19" fill="#76508B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing=".6">EXPLAINED RANKING</text>
    </g>

    <g transform="translate(340 43)">
      <rect width="228" height="171" rx="14" fill="#FFFFFF" fill-opacity=".68" stroke="#8A6B9C" stroke-opacity=".16"/>
      <text x="15" y="23" fill="#80678E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" letter-spacing="1.2">USER REPRESENTATION</text>

      <g transform="translate(50 78)">
        <circle r="27" fill="#A855F7" fill-opacity=".12"/>
        <circle r="15" fill="#A855F7" fill-opacity=".22"/>
        <circle cy="-5" r="5" fill="#7E22CE"/><path d="M-9 10c2-8 16-8 18 0" fill="#7E22CE"/>
        <circle cx="-38" cy="-29" r="5" fill="#38BDF8"/><circle cx="-38" cy="27" r="4" fill="#EC4899"/><circle cx="30" cy="-32" r="4" fill="#F59E0B"/>
        <path d="M-33-26L-11-9M-34 25L-11 7M27-29L10-9" stroke="#8A6B9C" stroke-opacity=".38" stroke-width="1.5"/>
      </g>

      <g transform="translate(113 44)" font-family="Inter, Segoe UI, Arial, sans-serif">
        <g><rect width="96" height="25" rx="7" fill="#F3E8FF"/><rect width="67" height="25" rx="7" fill="#A855F7" fill-opacity=".20"><animate attributeName="width" values="52;76;67;52" dur="5s" repeatCount="indefinite"/></rect><text x="9" y="17" fill="#5E3A70" font-size="9">01 · DESIGN</text></g>
        <g transform="translate(0 34)"><rect width="96" height="25" rx="7" fill="#FCE7F3"/><rect width="53" height="25" rx="7" fill="#EC4899" fill-opacity=".20"><animate attributeName="width" values="45;61;53;45" dur="4.5s" repeatCount="indefinite"/></rect><text x="9" y="17" fill="#75405E" font-size="9">02 · AI</text></g>
        <g transform="translate(0 68)"><rect width="96" height="25" rx="7" fill="#E0F2FE"/><rect width="39" height="25" rx="7" fill="#38BDF8" fill-opacity=".24"><animate attributeName="width" values="32;49;39;32" dur="4s" repeatCount="indefinite"/></rect><text x="9" y="17" fill="#315B70" font-size="9">03 · DATA</text></g>
      </g>

      <circle r="3.5" fill="#EC4899" filter="url(#soft)"><animateMotion dur="3s" repeatCount="indefinite" path="M74 78C93 78 96 56 113 56"/></circle>
      <text x="15" y="160" fill="#80678E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8">TWO-TOWER · SEQUENTIAL · COLLABORATIVE</text>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#745F7D"><text x="32" y="229">RUST</text><text x="78" y="229">PYTORCH</text><text x="145" y="229">NEXT.JS</text><text x="207" y="229">POSTGRESQL</text></g>
    <rect x=".75" y=".75" width="598.5" height="258.5" rx="17.25" fill="none" stroke="#80678E" stroke-opacity=".16" stroke-width="1.5"/>
    <rect y="257" width="600" height="3" fill="url(#accent)"><animate attributeName="opacity" values=".45;1;.45" dur="3.8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
