<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jon Zhang - GenAI and Full-Stack Engineer</title>
  <desc id="desc">An animated midnight-blue banner with a glowing grid, drifting lights, and Jon Zhang's introduction.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101F"/>
      <stop offset="0.52" stop-color="#0A1222"/>
      <stop offset="1" stop-color="#050A13"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(940 25) rotate(126) scale(430 560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#315CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientTransform="translate(210 350) rotate(-39) scale(340 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19C6B3" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#19C6B3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="92" y1="0" x2="1108" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="0.48" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#A8B3CF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur40" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur8" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="360" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#blueGlow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="360" fill="url(#tealGlow)">
      <animate attributeName="opacity" values="1;0.55;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <circle cx="1010" cy="142" r="118" fill="#315CFF" fill-opacity="0.10" filter="url(#blur40)">
      <animate attributeName="cx" values="1010;950;1010" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="142;196;142" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="284" r="78" fill="#20D6C7" fill-opacity="0.11" filter="url(#blur40)">
      <animate attributeName="cx" values="1080;1020;1080" dur="11s" repeatCount="indefinite"/>
    </circle>

    <path d="M620 62C748 21 852 31 957 93C1043 144 1088 228 1177 270" stroke="url(#accent)" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="7 11">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M720 304C816 248 895 237 972 246C1053 256 1109 293 1198 282" stroke="#2DD4BF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 12">
      <animate attributeName="stroke-dashoffset" values="0;-60" dur="10s" repeatCount="indefinite"/>
    </path>

    <g opacity="0.92">
      <circle cx="846" cy="54" r="3.5" fill="#4F7CFF" filter="url(#softGlow)">
        <animate attributeName="cy" values="54;78;54" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1096" cy="80" r="2.7" fill="#2DD4BF" filter="url(#softGlow)">
        <animate attributeName="cy" values="80;54;80" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="942" cy="270" r="3.2" fill="#7C6FFF" filter="url(#softGlow)">
        <animate attributeName="cx" values="942;975;942" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1150" cy="240" r="2.4" fill="#4F7CFF" filter="url(#softGlow)">
        <animate attributeName="cy" values="240;210;240" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="752" cy="186" r="2.3" fill="#2DD4BF" filter="url(#softGlow)">
        <animate attributeName="cx" values="752;776;752" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(92 58)">
      <text x="0" y="0" fill="#EEF3FF" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" font-weight="700">JZ.</text>
      <circle cx="64" cy="-8" r="3.2" fill="#4F7CFF">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(92 122)">
      <text x="0" y="0" fill="#91A0B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">HELLO / 你好</text>
      <rect x="0" y="14" width="52" height="2" rx="1" fill="url(#accent)"/>
    </g>

    <text x="88" y="205" fill="#F2F5FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="600" letter-spacing="-2.3">Hi, I’m Jon Zhang<tspan fill="#4F7CFF">.</tspan></text>
    <text x="92" y="250" fill="#CFD7E6" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic">GenAI / Full-Stack Engineer.</text>
    <text x="375" y="250" fill="#91A0B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Building intelligent systems and ambitious products.</text>

    <g transform="translate(92 294)">
      <circle cx="6" cy="6" r="6" fill="#2DD4BF" fill-opacity="0.16" filter="url(#blur8)"/>
      <circle cx="6" cy="6" r="3.5" fill="#2DD4BF">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="11" fill="#91A0B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.3">AVAILABLE FOR THOUGHTFUL COLLABORATIONS</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="21.25" stroke="#91A0B8" stroke-opacity="0.14" stroke-width="1.5"/>
    <rect x="0" y="357" width="1200" height="3" fill="url(#accent)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
